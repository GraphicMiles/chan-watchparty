apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// CI versioning: pass via -PversionCode=X -PversionName=Y
def ciVersionCode = project.hasProperty('versionCode') ? project.property('versionCode') as int : 1
def ciVersionName = project.hasProperty('versionName') ? project.property('versionName') : '1.0'

android {
    namespace "com.chan.watchparty"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
        // Compose for the native room player (Option B)
        compose true
    }

    defaultConfig {
        applicationId "com.chan.watchparty"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode
        versionName ciVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Keep LibVLC APK size reasonable for MVP. Most current Android devices
        // are arm64; add armeabi-v7a later only if you need older 32-bit phones.
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing — only applied when keystore file exists (CI injects it via secrets)
    if (file("app/chan-release.keystore").exists()) {
        signingConfigs {
            release {
                storeFile file("app/chan-release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty('storePassword') ?: ''
                keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty('keyAlias') ?: ''
                keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty('keyPassword') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("app/chan-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Allow mixed content (HTTP streams) — app uses HTTPS proxy but some CDN probes use HTTP
    // Capacitor 8's capacitor.build.gradle (applied below) forces Java 21 —
    // Kotlin must match or Gradle fails with "Inconsistent JVM-target compatibility".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // O2TV Scraper dependencies
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    
    // Video Player - Media3 primary path + LibVLC fallback for MKV/HEVC/odd containers
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-effect:1.2.1'
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // QR codes for the room share panel
    implementation 'com.google.zxing:core:3.5.3'

    // Compose — native room player (Option B)
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
