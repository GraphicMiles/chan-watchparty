services:
  - type: web
    name: chan
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      # CORS allowlist (JSON array). MUST be set — when unset, cors.js falls
      # back to Access-Control-Allow-Origin: * and any site can call the API.
      # Localhost and capacitor:// origins are always permitted, so setting
      # this does not break local dev or the Android build.
      - key: ALLOWED_ORIGINS
        sync: false
      # Proxy hostname allowlist (JSON array). Intentionally left UNSET: the
      # IPTV catalog is a third-party M3U fetched at runtime (thousands of
      # rotating CDN hosts, many bare IPs), so a static list would break live
      # TV. /api/proxy is instead protected by the SSRF checks in ssrf.js, a
      # per-IP rate limit, and the Origin/Referer gate below.
      - key: PROXY_ALLOWED_DOMAINS
        sync: false
      # Set to "false" to disable the proxy Origin/Referer gate if it ever
      # blocks a legitimate client. Defaults to enabled.
      - key: PROXY_REQUIRE_KNOWN_ORIGIN
        sync: false
      # Referer presented to the YouTube Data API. Set this if the key is
      # HTTP-referrer-restricted (Render provides RENDER_EXTERNAL_URL
      # automatically, which is used as the default).
      - key: YOUTUBE_API_REFERER
        sync: false
      # Optional: persistent rate limiting. Without these the limiter is
      # in-memory and resets on every deploy and free-tier spin-down.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional: stale-room sweep interval in ms (default 600000). Set to 0
      # to disable the in-process scheduler.
      - key: ROOM_CLEANUP_INTERVAL_MS
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_LIVEKIT_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
