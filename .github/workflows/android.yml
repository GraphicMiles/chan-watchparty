name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint web source
        run: npx eslint src --ext .js,.jsx,.ts

      - name: Build web assets
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK (compiles ChanPlayerEngine / RoomPlayerOverlayView / VideoPlayerPlugin)
        working-directory: android
        run: |
          BUILD_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PgitCommitSha=${{ github.sha }} \
            -PbuildTimestampUtc="$BUILD_TIMESTAMP_UTC"
          printf 'Commit: %s\nVersion: %s\nBuilt: %s\n' \
            "${GITHUB_SHA:0:12}" \
            "1.0.${{ github.run_number }}-debug" \
            "$BUILD_TIMESTAMP_UTC" \
            > app/build/outputs/apk/debug/build-identity.txt

      - name: Verify APK embeds checkout identity
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          IDENTITY="app/build/outputs/apk/debug/build-identity.txt"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          test -f "$APK"
          test -f "$IDENTITY"
          grep -F "Commit: $SHORT_SHA" "$IDENTITY"
          grep -F "Version: 1.0.${{ github.run_number }}-debug" "$IDENTITY"
          unzip -p "$APK" 'classes*.dex' | strings | grep -F "$SHORT_SHA"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -F "versionName='1.0.${{ github.run_number }}-debug'"

      - name: Show generated APK files
        if: success()
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: chan-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/build-identity.txt
          retention-days: 30
          if-no-files-found: error

      - name: Rename APK for GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Chan-${{ github.ref_name }}-debug.apk

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chan-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
