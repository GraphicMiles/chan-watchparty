name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Install Android SDK packages
        # ubuntu-latest runners ship the Android SDK (cmdline-tools, build-tools,
        # platforms). The android-actions/setup-android step was removed: it
        # requests the legacy "tools" package, which SDK cmdline-tools 16.0 no
        # longer publishes, failing the job before any build work starts.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint web source
        run: npx eslint src --ext .js,.jsx,.ts

      - name: Build web assets
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK (compiles ChanPlayerEngine / RoomPlayerOverlayView / VideoPlayerPlugin)
        working-directory: android
        run: |
          BUILD_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PgitCommitSha=${{ github.sha }} \
            -PbuildTimestampUtc="$BUILD_TIMESTAMP_UTC"
          printf 'Commit: %s\nVersion: %s\nBuilt: %s\n' \
            "${GITHUB_SHA:0:12}" \
            "1.0.${{ github.run_number }}-debug" \
            "$BUILD_TIMESTAMP_UTC" \
            > app/build/outputs/apk/debug/build-identity.txt

      - name: Verify APK embeds checkout identity
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          IDENTITY="app/build/outputs/apk/debug/build-identity.txt"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          test -f "$APK"
          test -f "$IDENTITY"
          grep -F "Commit: $SHORT_SHA" "$IDENTITY"
          grep -F "Version: 1.0.${{ github.run_number }}-debug" "$IDENTITY"
          unzip -p "$APK" 'classes*.dex' | strings | grep -F "$SHORT_SHA"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -F "versionName='1.0.${{ github.run_number }}-debug'"

      - name: Show generated APK files
        if: success()
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: chan-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/build-identity.txt
          retention-days: 30
          if-no-files-found: error

      # ── Signed release APK ─────────────────────────────────────────
      # Keystore + passwords come from GitHub Actions secrets only; never
      # committed or printed. Build/verify/upload FAIL the job when signing
      # cannot succeed on non-PR events.

      - name: Check signing secrets availability
        id: signing
        run: |
          if [ -n "${{ secrets.CHAN_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing required but secrets missing
        if: github.event_name != 'pull_request' && steps.signing.outputs.available != 'true'
        run: |
          echo "CHAN_KEYSTORE_BASE64 (and KEY_ALIAS/KEY_*_PASSWORD) secrets are required to build the signed release APK."
          exit 1

      - name: Decode release keystore from secrets
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "${{ secrets.CHAN_KEYSTORE_BASE64 }}" | base64 -d > android/app/chan-release.keystore
          test -s android/app/chan-release.keystore

      - name: Build signed Release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PgitCommitSha=${{ github.sha }} \
            -PbuildTimestampUtc="$BUILD_TIMESTAMP_UTC"

      - name: Verify release APK signature
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -F "versionName='1.0.${{ github.run_number }}'"
          if unzip -l "$APK" | grep -qiE 'DEBUG|\.debug'; then
            echo "FAIL: APK looks like a debug artifact"
            exit 1
          fi
          echo "OK: release APK is signed and version-stamped"

      - name: Delete keystore from workspace
        if: always()
        run: rm -f android/app/chan-release.keystore

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        if: success() && steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        with:
          name: chan-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rename APK for GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Chan-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Chan-${{ github.ref_name }}.apk
          generate_release_notes: true
