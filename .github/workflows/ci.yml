name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --ext .js,.jsx,.ts

      - name: Build
        run: npm run build

      - name: Verify no stray references to removed fallback/choice UI
        run: |
          if grep -rn "nativeChoice\|rememberNativeChoice\|Try Web Player Anyway" src --include="*.jsx" --include="*.js" --include="*.ts"; then
            echo "FAIL: removed fallback/choice references still present"
            exit 1
          fi
          echo "OK: no leftover fallback/choice references"
